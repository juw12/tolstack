# tolstack run examples/demo_config.yaml
version: 1                           # config schema version
title: Tolerance stack-up
project: tolstack demo
name: STEP - cap top vs post top
type: step
author: tolstack
step: demo/demo_assembly.step
axis: z
from: {part: POST, face: top}        # reference face
to: {part: CAP_TOP, face: top}       # result = to - from
exclude: []                          # parts the chain must not pass through
chain_option: 1                      # 1 = best ranked chain; see `tolstack paths <config>`
contact_tol: 0.02                    # faces closer than this (mm) count as touching
spec: {lsl: 1.2, usl: 2.0}
drawings: [demo/drawings/*.pdf]      # matched to parts by file name
drawing_map: {}                      # e.g. {BASE: demo/drawings/BASE.pdf, POST: ''} overrides the match
ocr: false                           # OCR drawings without a text layer (needs Tesseract)
sigma_level: 3                       # tolerance = +/- 3 sigma for 'normal' rows
mc_samples: 100000
general_tolerance:                   # [from, to, ±tol] used when the 2D has no tolerance
  - [0, 10, 0.05]
  - [10, 50, 0.10]
  - [50, 1000000, 0.15]
extra:                               # contributors that are not part thickness (bow, gaps, switch travel...)
  - {label: X, part: PCB, description: PCB bow at contact (assumed), nominal: 0, tol_plus: 0.1, tol_minus: 0.1, direction: 1}
overrides: {}                        # e.g. {B: {tol_plus: 0.03, tol_minus: 0.03, dist: uniform, source: "CPK data"}}
section: {cut_axis: y}
output: out/demo_ta.xlsx
