[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tolstack"
version = "0.4.0"
description = "1-D tolerance stack-up (gap / step) from a STEP assembly and 2D drawings, exported to Excel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "cadquery-ocp>=7.7",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pymupdf>=1.23",
    "pillow>=10",
    "pyyaml>=6",
    "shapely>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.49", "pandas>=2.0", "plotly>=5.20"]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/juw12/tolstack"
Changelog = "https://github.com/juw12/tolstack/blob/main/CHANGELOG.md"

[project.scripts]
tolstack = "tolstack.cli:main"

[tool.setuptools]
packages = ["tolstack"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["tolstack"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["OCP.*", "fitz.*", "shapely.*", "openpyxl.*", "yaml.*", "streamlit.*", "pandas.*", "matplotlib.*", "PIL.*", "plotly.*"]
ignore_missing_imports = true
